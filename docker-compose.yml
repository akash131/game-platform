version: '3.8'

services:
  # Game Platform API
  game-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-platform-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongo:27017/game-platform
    depends_on:
      - redis
      - mongo
    networks:
      - game-network
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: game-platform-redis
    ports:
      - "6379:6379"
    networks:
      - game-network
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  # MongoDB for persistence
  mongo:
    image: mongo:7
    container_name: game-platform-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=game-platform
    networks:
      - game-network
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    restart: unless-stopped

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: game-platform-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - game-platform
    networks:
      - game-network
    restart: unless-stopped

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: game-platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - game-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: game-platform-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - game-network
    restart: unless-stopped

networks:
  game-network:
    driver: bridge

volumes:
  redis-data:
  mongo-data:
  mongo-config:
  prometheus-data:
  grafana-data:
